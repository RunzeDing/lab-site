<style>
  :root{
    --ink:#0b1220; --muted:#5b6575; --line:#e7eaf1; --bg:#ffffff;
    --surface:#f6f8fb; --accent:#2563eb; --accent-2:#0ea5e9;
    --accent-soft:#eaf1ff; --dark:#0b1220; --radius:16px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12);
    --font:'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  img{display:block;max-width:100%}
  .container{max-width:1100px;margin:0 auto;padding:0 24px}

  /* header */
  .site-header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .header-inner{display:flex;align-items:center;justify-content:space-between;height:66px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:700;font-size:17px;color:var(--ink)}
  .brand:hover{text-decoration:none}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;letter-spacing:.5px}
  .brand small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:.02em;margin-top:-3px}
  .nav{display:flex;align-items:center;gap:2px}
  .nav a{padding:7px 13px;border-radius:9px;color:#374151;font-weight:550;font-size:14.5px}
  .nav a:hover{background:var(--surface);text-decoration:none;color:var(--ink)}
  .nav a.active{background:var(--accent-soft);color:var(--accent)}
  .nav-burger{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:40px;height:38px;font-size:18px;cursor:pointer}

  /* hero — 浅色 */
  .hero{background:linear-gradient(180deg,#fbfcfe 0%, #ffffff 100%);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 82% -8%, rgba(37,99,235,.10), transparent 55%), radial-gradient(700px 360px at -8% 110%, rgba(14,165,233,.10), transparent 55%);pointer-events:none}
  .hero-inner{padding:76px 0 72px;position:relative}
  .hero-center{text-align:center;display:flex;flex-direction:column;align-items:center}
  .hero-center .hero-tags{justify-content:center}
  .hero-center .hero-actions{justify-content:center}
  .hero-head{display:flex;align-items:stretch;justify-content:flex-start;gap:24px}
  .hero-titles{min-width:0}
  .hero-affil{font-size:17px;font-weight:650;color:var(--accent);margin-top:14px;letter-spacing:.01em}
  .hero-logo{flex:none;width:108px;border:2px dashed #cbd5e1;border-radius:16px;background:var(--surface);display:grid;place-items:center;color:#94a3b8;font-weight:600;font-size:12px;letter-spacing:.08em}
  .hero .kicker{display:inline-flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent);border:1px solid #dbe7ff;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.04em;margin-bottom:22px}
  .hero h1{font-size:50px;line-height:1.08;letter-spacing:-.02em;font-weight:760;color:var(--ink)}
  .hero h1 .grad{background:linear-gradient(90deg,#2563eb,#0ea5e9);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p.lead{margin-top:20px;max-width:660px;font-size:17.5px;color:var(--muted)}
  .hero-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
  .hero-tags a{font-size:13px;font-weight:600;color:#374151;background:#fff;border:1px solid var(--line);padding:6px 14px;border-radius:999px;transition:.14s}
  .hero-tags a:hover{text-decoration:none;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .hero-actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 20px;border-radius:11px;font-weight:600;font-size:14.5px;border:1px solid transparent;cursor:pointer;transition:.16s}
  .btn:hover{text-decoration:none}
  .btn-primary{background:var(--dark);color:#fff}
  .btn-primary:hover{background:#1e293b}
  .btn-ghost{background:#fff;border-color:var(--line);color:#374151}
  .btn-ghost:hover{background:var(--surface);border-color:#d6dbe6}

  /* sections */
  main{padding-bottom:60px}
  .section{padding:52px 0 8px}
  .section-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:22px;gap:16px}
  .section-title{font-size:22px;font-weight:720;letter-spacing:-.01em}
  .section-sub{color:var(--muted);font-size:14px;margin-top:3px}
  .see-all{font-size:14px;font-weight:600;white-space:nowrap}

  /* cards grid */
  .grid{display:grid;gap:18px}
  .grid.members{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .grid.research{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .card{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);transition:transform .18s, box-shadow .18s}
  .card:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(16,24,40,.05), 0 16px 36px -14px rgba(16,24,40,.2)}
  .card h3{font-size:16.5px;font-weight:680}
  .card p{color:var(--muted);font-size:14px;margin-top:8px}
  .area-icon{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:20px;margin-bottom:14px}

  /* member card */
  .member-card{display:flex;flex-direction:column;gap:10px}
  .member-photo{aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
  .member-photo .avatar{width:100%;height:100%;border-radius:0;font-size:46px;object-fit:cover}
  .avatar{width:62px;height:62px;border-radius:16px;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px;background-size:cover;background-position:center}
  .member-card h3{font-size:16.5px;line-height:1.25}
  .member-card .role{color:var(--muted);font-size:13px;margin-top:2px}
  .pi-list{display:flex;flex-direction:column;gap:18px;margin-bottom:6px}
  .pi-card{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap;padding:28px}
  .pi-card .avatar{width:150px;height:150px;border-radius:18px;font-size:44px;object-fit:cover}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:2px 9px;border-radius:999px;letter-spacing:.02em}
  .badge.PI{background:#fef3c7;color:#b45309}
  .badge.PhD{background:var(--accent-soft);color:var(--accent)}
  .badge.Master{background:#e7f7ee;color:#0f8a4f}
  .badge.Visiting{background:#f3e8ff;color:#7c3aed}
  .badge.Undergrad{background:#f1f5f9;color:#475569}
  .badge.Alumni{background:#f1f5f9;color:#94a3b8}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
  .tag{font-size:12px;color:#475569;background:var(--surface);border:1px solid var(--line);padding:2px 9px;border-radius:7px}
  .member-links{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:auto;padding-top:6px;font-size:12.5px}
  .member-links a{color:#475569;font-weight:550}
  .member-links a:hover{color:var(--accent)}
  .member-links a.email-icon{display:inline-flex;align-items:center;vertical-align:middle}
  .member-links a.email-icon svg{width:15px;height:15px}

  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .filter{font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:#475569;cursor:pointer}
  .filter.on{background:var(--dark);color:#fff;border-color:var(--dark)}

  /* publications */
  .pub-list{display:flex;flex-direction:column;gap:14px}
  .pub-item{display:flex;gap:18px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);transition:box-shadow .18s}
  .pub-item:hover{box-shadow:0 2px 4px rgba(16,24,40,.05), 0 18px 40px -14px rgba(16,24,40,.18)}
  .pub-main{flex:1;min-width:0}
  .pub-title{font-size:16px;font-weight:680;line-height:1.4}
  .pub-title a{color:var(--ink)}
  .pub-title a:hover{color:var(--accent)}
  .pub-authors{font-size:13.5px;color:var(--muted);margin-top:6px}
  .pub-authors b{color:#1f2937;font-weight:650}
  .pub-venue{font-size:13px;color:#6b7280;margin-top:4px}
  .pub-venue .vj{color:#334155;font-weight:600;font-style:italic}
  .pub-venue .type{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;margin-right:8px;vertical-align:1px}
  .type.journal{background:#e7f7ee;color:#0f8a4f}
  .type.conference{background:var(--accent-soft);color:var(--accent)}
  .type.preprint{background:#f3e8ff;color:#7c3aed}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:#374151;transition:.14s}
  .chip:hover{text-decoration:none;border-color:var(--accent);color:var(--accent)}
  .chip svg{width:13px;height:13px}
  .chip.bilibili:hover{color:#fb7299;border-color:#fb7299}
  .chip.code:hover{color:#24292f;border-color:#24292f}
  .pub-media{width:400px;flex:none;border-radius:12px;overflow:hidden;border:1px solid var(--line);position:relative;cursor:pointer;align-self:center;aspect-ratio:16/10;background:var(--surface)}
  .pub-media .thumb{width:100%;height:100%;display:grid;place-items:center;font-size:28px}
  .pub-media .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff}
  .pub-media .play span{width:40px;height:40px;border-radius:50%;background:rgba(11,18,32,.55);display:grid;place-items:center}
  .pub-media .play svg{width:18px;height:18px}
  .pub-metrics{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
  .metric{display:inline-flex;flex-direction:column;gap:1px;padding:7px 13px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
  .metric b{font-size:16px;font-weight:720;color:var(--ink);line-height:1.1}
  .metric span{font-size:11px;color:var(--muted);letter-spacing:.02em}
  .year-head{display:flex;align-items:center;gap:14px;font-size:19px;font-weight:720;color:var(--ink);margin:30px 0 14px}
  .year-head::after{content:"";flex:1;height:1px;background:var(--line)}

  /* research detail — 双栏横屏 */
  .rdetail{display:grid;grid-template-columns:1.05fr 1fr;gap:36px;align-items:start}
  .rdetail .rtext h1{font-size:30px;font-weight:750;letter-spacing:-.02em;margin-bottom:8px}
  .rdetail .rtext .rblurb{color:var(--muted);font-size:15px;margin-bottom:18px}
  .rdetail .rtext h2{font-size:17px;margin:24px 0 8px}
  .rdetail .rtext p{color:#374151;margin:8px 0}
  .rdetail .rtext ul{margin:8px 0 8px 20px}
  .rdetail .rtext li{margin:6px 0;color:#374151}
  .rback{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--muted);margin-bottom:18px}
  .rback:hover{color:var(--accent);text-decoration:none}
  .media-col{display:flex;flex-direction:column;gap:16px}
  .media-figure{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
  .media-figure .mmedia{aspect-ratio:16/10;display:grid;place-items:center;font-size:38px;position:relative;overflow:hidden}
  .media-figure .mmedia img{width:100%;height:100%;object-fit:cover;cursor:zoom-in}
  .media-figure .mmedia iframe{width:100%;height:100%;border:0;background:#000}
  .media-figure .mplay{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:50%;background:rgba(11,18,32,.55);display:grid;place-items:center;color:#fff}
  .media-figure .mplay svg{width:22px;height:22px}
  .media-figure figcaption{padding:11px 15px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);background:#fff}

  /* news */
  .news-list{display:flex;flex-direction:column;gap:0}
  .news-item{display:flex;gap:20px;padding:18px 4px;border-bottom:1px solid var(--line)}
  .news-item:last-child{border-bottom:none}
  .news-date{width:110px;flex:none;font-size:13px;color:var(--muted);padding-top:2px}
  .news-body h3{font-size:16px;font-weight:650}
  .news-body p{color:var(--muted);font-size:14px;margin-top:5px;max-width:720px}
  .news-tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-bottom:6px}

  /* markdown page */
  .md h1{font-size:30px;margin:8px 0 18px}
  .md h2{font-size:20px;margin:26px 0 10px}
  .md h3{font-size:16px;margin:18px 0 8px}
  .md p{margin:10px 0;color:#374151}
  .md ul,.md ol{margin:10px 0 10px 22px}
  .md li{margin:5px 0}
  .md code{background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:13px}

  .empty{color:var(--muted);font-size:14px;padding:24px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--radius)}

  footer{border-top:1px solid var(--line);background:var(--surface);padding:36px 0}
  footer .container{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}

  /* lightbox */
  .lightbox{position:fixed;inset:0;z-index:100;background:rgba(8,12,20,.82);display:none;align-items:center;justify-content:center;padding:40px;backdrop-filter:blur(3px)}
  .lightbox.open{display:flex}
  .lightbox-box{max-width:900px;width:100%;border-radius:14px;overflow:hidden;background:#0b1220;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);position:relative}
  .lightbox-box img{width:100%;max-height:72vh;object-fit:contain;background:#0b1220}
  .lightbox-box iframe{width:100%;height:70vh;border:0;display:block;background:#000}
  .lightbox-box .ph{width:100%;height:60vh;display:grid;place-items:center;color:#c7d7f7;text-align:center;padding:40px}
  .lightbox-close{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;line-height:1}

  @media (max-width:760px){
    .hero h1{font-size:32px}
    .nav{display:none;position:absolute;top:66px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;padding:8px;gap:4px}
    .nav.open{display:flex}
    .nav-burger{display:block}
    .pub-item{flex-direction:column}
    .pub-media{width:100%;align-self:stretch}
    .news-item{flex-direction:column;gap:4px}
    .news-date{width:auto}
    .rdetail{grid-template-columns:1fr}
    .hero-head{flex-direction:column;align-items:flex-start;gap:18px}
    .hero-logo{width:84px;height:84px}
  }
</style>

<script>
/* =====================================================================
   数据从 data.js 加载（window.SITE_DATA）—— 日常维护用编辑器或直接改 data.js。
   ===================================================================== */
const SITE = SITE_DATA.site;

const PAGES = SITE_DATA.pages;

const MEMBERS = SITE_DATA.members;

// 论文数据见 data.js → SITE_DATA.publications（结构化对象）

const RESEARCH = SITE_DATA.research;

const NEWS = SITE_DATA.news;

const OPENINGS = SITE_DATA.openings;

/* =====================================================================
   渲染器（固定逻辑，一般无需修改）
   ===================================================================== */
const $  = (s)=>document.querySelector(s);
const esc= (s)=>String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---- BibTeX 解析 ---- */
function parseBib(text){
  const out=[]; let i=0;
  const s=text.replace(/^\s*%.*$/gm,"");
  while(i<s.length){
    const at=s.indexOf("@",i); if(at<0) break;
    const m=s.slice(at).match(/^@(\w+)\s*\{\s*([^,\s{]+)\s*,/);
    if(!m){ i=at+1; continue; }
    const type=m[1].toLowerCase(), key=m[2];
    let j=at+m[0].length, depth=1, end=-1;
    for(let k=j;k<s.length;k++){
      if(s[k]==="{")depth++;
      else if(s[k]==="}"){
        depth--;
        if(depth===0){end=k;break;}
      }
    }
    if(end<0) break;
    const body=s.slice(j,end);
    const fields={}; let k=0;
    while(k<body.length){
      const fm=body.slice(k).match(/^\s*([a-zA-Z0-9_-]+)\s*=\s*/);
      if(!fm){ k++; continue; }
      const name=fm[1].toLowerCase(); let p=k+fm[0].length; let val="";
      if(body[p]==="{"){
        let d=1,q=p+1; val="";
        for(;q<body.length;q++){ if(body[q]==="{")d++; else if(body[q]==="}"){d--; if(d===0)break;} val+=body[q]; }
        k=q+1;
      }else if(body[p]==='"'){
        let q=p+1; val="";
        for(;q<body.length;q++){ if(body[q]==='"')break; val+=body[q]; }
        k=q+1;
      }else{
        const w=body.slice(p).match(/^\s*([^,\s]+)/); val=w?w[1]:""; k=p+(w?w[0].length:1);
      }
      fields[name]=val.trim();
      const cm=body.slice(k).match(/^\s*,/); if(cm) k+=cm[0].length;
    }
    out.push({type,key,fields});
    i=end+1;
  }
  return out;
}

const AUTHOR_HIGHLIGHT = [];

function parseAuthors(raw){
  const out=[]; let cur="", depth=0;
  for(const ch of raw){ if(ch==="{")depth++; else if(ch==="}")depth--; if(ch==="and"&&depth===0){/*naive*/} }
  // split on " and "
  const parts=String(raw).split(/\s+and\s+/);
  for(let p of parts){
    p=p.trim().replace(/[{}]/g,"").replace(/\s+/g," ");
    if(!p) continue;
    let first=p,last="";
    const c=p.split(",");
    if(c.length>=2){ last=c[0].trim(); first=c.slice(1).join(",").trim(); }
    else{ const w=p.split(" "); if(w.length>=2){ last=w[w.length-1]; first=w.slice(0,-1).join(" ");} }
    const name=(first+" "+last).trim();
    out.push(name);
  }
  return out;
}

function authorHTML(raw){
  return parseAuthors(raw).map(n=>{
    const hit=AUTHOR_HIGHLIGHT.some(h=>n.includes(h)||h.includes(n));
    return hit?`<b>${esc(n)}</b>`:esc(n);
  }).join(", ");
}

function linkChips(pub){
  const f=pub.fields, chips=[];
  const doi=f.doi||f.url;
  if(doi) chips.push({kind:"paper", label:"Paper", href:doi.startsWith("http")?doi:"https://doi.org/"+doi});
  if(f.github) chips.push({kind:"code", label:"Code", href:f.github});
  if(f.bilibili) chips.push({kind:"bilibili", label:"Video", href:f.bilibili});
  if(f.project) chips.push({kind:"paper", label:"Project", href:f.project});
  return chips;
}

function avatarHTML(m){
  if(m.avatar) return `<img class="avatar" src="${esc(m.avatar)}" alt="">`;
  let h=0; for(const c of m.name) h=(h*31+c.charCodeAt(0))>>>0;
  const hue=h%360, ini=m.name.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
  return `<div class="avatar" style="background:linear-gradient(135deg,hsl(${hue},62%,48%),hsl(${(hue+40)%360},62%,40%))">${esc(ini)}</div>`;
}

function memberLinks(m){

  if(m.email) items.push(`<a class="email-icon" href="mailto:${esc(m.email)}" title="${esc(m.email)}" aria-label="Email">${ICONS.email}</a>`);

  if(m.links?.scopus) items.push(`<a href="${esc(m.links.scopus)}" target="_blank" rel="noopener">Scopus</a>`);

}

function pubItem(pub, hideMedia){
  const f=pub.fields;
  const gi=PUBS.indexOf(pub);
  const typeMap={article:"journal",inproceedings:"conference",misc:"preprint"};
  const t=typeMap[pub.type]||"journal";
  const tlabel={journal:"J",conference:"C",preprint:"P"}[t];
  const hasMedia=hideMedia?false:!!(f.video||f.image);
  const mediaKind=f.video?"video":"image";
  const thumbTone=["#dbeafe","#dcfce7","#fef3c7","#fae8ff","#ffedd5"][gi%5];
  const thumbURL=(f.thumb&&f.thumb!=="true")?f.thumb:((f.image&&f.image!=="true")?f.image:null);
  const media=`<div class="pub-media" data-media="${gi}">
      ${thumbURL?`<img src="${esc(thumbURL)}" alt="" style="width:100%;height:100%;object-fit:cover">`:`<div class="thumb" style="background:linear-gradient(135deg,${thumbTone},#ffffff)">${mediaKind==="video"?'▶️':'🖼️'}</div>`}
      ${mediaKind==="video"?'<div class="play"><span>'+ICONS.play+'</span></div>':''}
    </div>`;
  const metricsHTML = f.metrics ? `<div class="pub-metrics">${f.metrics.split("|").map(m=>{const s=m.trim().split(":");const label=(s.shift()||"").trim();const value=s.join(":").trim();return `<div class="metric"><b>${esc(value)}</b><span>${esc(label)}</span></div>`;}).join("")}</div>` : "";
  return `<div class="pub-item" data-pub="${gi}">
    <div class="pub-main">
      <div class="pub-title"><a href="${f.doi?(f.doi.startsWith('http')?f.doi:'https://doi.org/'+f.doi):'#publications'}">${esc(f.title)}</a></div>
      <div class="pub-authors">${authorHTML(f.author||"")}</div>
      <div class="pub-venue"><span class="type ${t}">${tlabel}</span><span class="vj">${esc(f.journal||f.booktitle||"")}</span>${f.volume?`, vol. ${esc(f.volume)}`:""}${f.pages?`, pp. ${esc(f.pages)}`:""} · ${esc(f.year||"")}${f.note?` (${esc(f.note)})`:""}</div>
      ${metricsHTML}
      <div class="chips">${linkChips(pub).map(c=>`<a class="chip ${c.kind}" href="${esc(c.href)}" target="_blank" rel="noopener">${ICONS[c.kind]||ICONS.paper}${esc(c.label)}</a>`).join("")}</div>
    </div>
    ${hasMedia?media:""}
  </div>`;
}

/* 极简 Markdown 渲染（供“新增页面”用） */
function renderMD(md){
  const html=[]; let inList=false, listType="";
  const lines=String(md||"").replace(/\r/g,"").split("\n");
  const inline=t=>esc(t)
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>")
    .replace(/`(.+?)`/g,"<code>$1</code>")
    .replace(/\[(.+?)\]\((https?:\/\/[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const closeList=()=>{ if(inList){ html.push(listType); inList=false; } };
  for(const ln of lines){
    const h=ln.match(/^(#{1,3})\s+(.*)/);
    if(h){ closeList(); html.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    const ul=ln.match(/^\s*[-*]\s+(.*)/);
    if(ul){ if(!inList||listType!=="<ul>"){ closeList(); html.push("<ul>"); inList=true; listType="</ul>"; } html.push(`<li>${inline(ul[1])}</li>`); continue; }
    const ol=ln.match(/^\s*\d+\.\s+(.*)/);
    if(ol){ if(!inList||listType!=="<ol>"){ closeList(); html.push("<ol>"); inList=true; listType="</ol>"; } html.push(`<li>${inline(ol[1])}</li>`); continue; }
    closeList();
    if(ln.trim()==="") continue;
    html.push(`<p>${inline(ln)}</p>`);
  }
  closeList();
  return html.join("");
}

function renderPage(id, sub){
  const p=PAGES.find(x=>x.id===id);
  if(!p){ app.innerHTML=`<div class="container"><div class="empty">Page not found.</div></div>`; return; }
  if(id==="home") renderHome();
  else if(id==="news") renderNews();
  else if(id==="members") renderMembers();
  else if(id==="publications") renderPublications();
  else if(id==="research"){ const r=RESEARCH.find(x=>x.id===sub); if(r) renderResearchDetail(r); else renderResearch(); }
  else if(id==="positions") renderJoin();
  else app.innerHTML=`<div class="container"><section class="section" style="padding-top:40px"><div class="md">${renderMD(p.md)}</div></section></div>`;
}

    lbContent.innerHTML = url
      ? `<img src="${esc(url)}" alt="">`
      : `<div class="ph"><div><div style="font-size:46px">🖼️</div><p style="margin-top:14px;color:#9fb2d6">论文图片展示窗占位</p><p style="font-size:13px;margin-top:6px">把 <code>image</code> 字段改为图片 URL 即可显示</p></div></div>`;
  }
  lightbox.classList.add("open");
}
function closeMedia(){ lightbox.classList.remove("open"); lbContent.innerHTML=""; }

/* ---- 事件委托 ---- */
function bindDelegates(){
  app.onclick=e=>{
    const media=e.target.closest(".pub-media");
    if(media){ const i=+media.dataset.media; if(PUBS[i]) openMedia(PUBS[i]); return; }
    const rimg=e.target.closest(".mmedia img");
    if(rimg){ lbContent.innerHTML=`<img src="${esc(rimg.src)}" alt="">`; lightbox.classList.add("open"); return; }
    const f=e.target.closest(".filter");
    if(f){
      if(f.dataset.degree!==undefined){ state.degreeFilter=f.dataset.degree; renderMembers(); bindDelegates(); }
      if(f.dataset.year!==undefined){ state.yearFilter=f.dataset.year; renderPublications(); bindDelegates(); }
    }
  };
}

/* ---- 初始化 ---- */
let PUBS=SITE_DATA.publications.slice();
const state={degreeFilter:"All",yearFilter:"All"};

const lg=$("#brand-logo"); lg.textContent=SITE.short; if(SITE.short.length>=3) lg.style.fontSize="12px";
$("#brand-name").textContent=SITE.name;
$("#brand-affil").textContent=SITE.affiliation;
$("#foot-brand").textContent=`© 2026 ${SITE.name} · ${SITE.affiliation}`;
document.title=`${SITE.name}`;

window.addEventListener("hashchange",route);
$("#burger").onclick=()=>nav.classList.toggle("open");
$("#lb-close").onclick=closeMedia;
lightbox.onclick=e=>{ if(e.target===lightbox) closeMedia(); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeMedia(); });

route();
</script>
</body>
